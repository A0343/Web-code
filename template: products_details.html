{% extends "base.html" %}
{% block content %}
<div class="py-8">
  <div class="flex flex-col md:flex-row gap-8">
    <!-- Product Image -->
    <div class="md:w-1/2">
      <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-auto object-cover rounded-lg">
    </div>
    
    <!-- Product Details -->
    <div class="md:w-1/2">
      <h1 class="text-3xl font-serif mb-2">{{ product.name }}</h1>
      <p class="text-2xl font-semibold mb-4">${{ "%.2f"|format(product.price) }}</p>
      
      <div class="divider"></div>
      
      <div class="mb-6">
        <h3 class="font-semibold mb-2">Description</h3>
        <p>{{ product.description }}</p>
      </div>
      
      <div class="mb-6">
        <h3 class="font-semibold mb-2">Size</h3>
        <p>{{ product.size }}</p>
      </div>
      
      <div class="mb-6">
        <h3 class="font-semibold mb-2">Availability</h3>
        {% if product.availability %}
        <span class="badge badge-success">In Stock</span>
        {% else %}
        <span class="badge badge-error">Out of Stock</span>
        {% endif %}
      </div>
      
      <form action="/cart/add" method="post" class="mt-8">
        <input type="hidden" name="product_id" value="{{ product.id }}">
        <button type="submit" class="btn btn-primary btn-block" {{ "disabled" if not product.availability }}>
          {% if product.availability %}Add to Cart{% else %}Out of Stock{% endif %}
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
