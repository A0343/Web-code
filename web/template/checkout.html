{% extends "base.html" %}
{% block content %}
<div class="py-8">
  <h1 class="text-4xl font-serif mb-8">Checkout</h1>
  
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Shipping Information Form -->
    <div class="lg:w-2/3">
      <div class="bg-base-200 p-6 rounded-lg">
        <h2 class="text-2xl mb-4">Shipping Information</h2>
        
        <form action="/checkout" method="post">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="form-control">
              <label class="label">
                <span class="label-text">First Name</span>
              </label>
              <input type="text" name="first_name" required class="input input-bordered w-full">
            </div>
            
            <div class="form-control">
              <label class="label">
                <span class="label-text">Last Name</span>
              </label>
              <input type="text" name="last_name" required class="input input-bordered w-full">
            </div>
          </div>
          
          <div class="form-control mb-4">
            <label class="label">
              <span class="label-text">Email</span>
            </label>
            <input type="email" name="email" required class="input input-bordered w-full">
          </div>
          
          <div class="form-control mb-4">
            <label class="label">
              <span class="label-text">Address</span>
            </label>
            <input type="text" name="address" required class="input input-bordered w-full">
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="form-control">
              <label class="label">
                <span class="label-text">City</span>
              </label>
              <input type="text" name="city" required class="input input-bordered w-full">
            </div>
            
            <div class="form-control">
              <label class="label">
                <span class="label-text">Postal Code</span>
              </label>
              <input type="text" name="postal_code" required class="input input-bordered w-full">
            </div>
          </div>
          
          <div class="form-control mb-6">
            <label class="label">
              <span class="label-text">Phone</span>
            </label>
            <input type="tel" name="phone" required class="input input-bordered w-full">
          </div>
          
          <div class="form-control">
            <button type="submit" class="btn btn-primary">Complete Order</button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- Order Summary -->
    <div class="lg:w-1/3">
      <div class="bg-base-200 p-6 rounded-lg">
        <h2 class="text-2xl mb-4">Order Summary</h2>
        
        <div class="flex justify-between mb-2">
          <span>Subtotal</span>
          <span>${{ "%.2f"|format(total) }}</span>
        </div>
        
        <div class="flex justify-between mb-2">
          <span>Shipping</span>
          <span>$0.00</span>
        </div>
        
        <div class="flex justify-between mb-2">
          <span>Tax</span>
          <span>${{ "%.2f"|format(total * 0.1) }}</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="flex justify-between text-lg font-bold">
          <span>Total</span>
          <span>${{ "%.2f"|format(total * 1.1) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
